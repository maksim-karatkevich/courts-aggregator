# E2E against a production deployment, before it goes live.
#
# Vercel builds the production deployment, holds it (Deployment Checks), and
# sends `vercel.deployment.ready`. This workflow tests that deployment's own
# URL and reports a commit status; Vercel promotes it to the domain only when
# the status is green. See docs/testing.md for the one-time setup.
#
# Note: repository_dispatch only triggers workflows that exist on main.
name: E2E

on:
  repository_dispatch:
    types: ['vercel.deployment.ready']
  workflow_dispatch:
    inputs:
      url:
        description: 'Deployment URL to test (https://…)'
        required: true
        type: string

run-name: >-
  E2E ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.shortSha || inputs.url }}

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      CI: true
      E2E_BASE_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.url || inputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # Sets "pending" now and the job's result at the end (its post step),
      # on the deployment's commit. This is the check Vercel waits for.
      - name: Report status to Vercel
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - ${{ github.event.client_payload.project.name }}: e2e'

      # Test the code that was deployed, not whatever main is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
